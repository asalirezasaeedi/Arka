[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dgp-plus-plus"
version = "3.0.0"
authors = [{name = "DGP++ Authors", email = "research@example.com"}]
description = "DGP++ v3.0 multi-manifold non-stationary synthetic data generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.21", "pandas>=1.3", "pyarrow>=8.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
dgp-plus-plus = "dgp_plus_plus:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["dgp_plus_plus"]
